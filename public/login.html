<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ResumeIQ</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#edf3ff,transparent 35%),#f6f8fc}.login-wrap{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid #e7ebf3;border-radius:18px;padding:34px;box-shadow:0 18px 55px #243b6310}.login-brand{display:flex;justify-content:center;margin-bottom:22px}.login-wrap h1{text-align:center;font:800 24px Manrope;color:#13213c;margin:0 0 9px}.login-sub{text-align:center;color:#75819a;font-size:12px;line-height:1.6;margin:0 0 25px}.login-wrap label{display:block;font-size:12px;font-weight:700;margin:13px 0 7px}.login-wrap input{width:100%;border:1px solid #dfe5ef;border-radius:8px;padding:13px;outline:none}.login-wrap input:focus{border-color:#8aa9ff;box-shadow:0 0 0 3px #356df314}.login-error{display:none;background:#fff0ee;color:#ad4539;padding:10px;border-radius:7px;font-size:11px;margin:12px 0}.login-foot{text-align:center;font-size:10px;color:#8b96a9;line-height:1.6;margin-top:17px}.login-foot a{color:#356df3}</style></head>
<body><main class="login-wrap"><div class="login-brand"><a class="brand" href="/"><span class="brand-mark">R</span><span><strong>ResumeIQ</strong><small>CAREER INTELLIGENCE</small></span></a></div><h1 id="heading">Welcome back</h1><p class="login-sub" id="sub">Sign in or create your private workspace with an email code.</p><div id="error" class="login-error" role="alert"></div><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required><div id="codeGroup" class="hidden"><label for="code">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></div><button class="btn btn-primary btn-wide" id="submit" style="margin-top:18px" type="submit">Email me a sign-in code →</button></form><p class="login-foot">Your original resume text is not saved by ResumeIQ. By signing in, you can save analysis scores and skill progress to your account.</p></main>
<script>
const form=document.getElementById("loginForm"),email=document.getElementById("email"),code=document.getElementById("code"),group=document.getElementById("codeGroup"),button=document.getElementById("submit"),error=document.getElementById("error"),heading=document.getElementById("heading"),sub=document.getElementById("sub");let step="email";
function showError(e){error.textContent=e&&e.message?e.message:"Something went wrong. Please try again.";error.style.display="block"}
function nextPath(){const n=new URLSearchParams(location.search).get("next")||"/";return n.startsWith("/")&&!n.startsWith("//")?n:"/"}
form.addEventListener("submit",async e=>{e.preventDefault();error.style.display="none";button.disabled=true;try{if(!window.hatchable||!hatchable.auth)throw Error("Authentication is still loading. Refresh and try again.");if(step==="email"){await hatchable.auth.startLogin({email:email.value.trim()});step="code";group.classList.remove("hidden");heading.textContent="Check your inbox";sub.textContent="Enter the one-time code sent to "+email.value.trim()+".";button.textContent="Verify and continue →";code.required=true;code.focus()}else{await hatchable.auth.verifyCode({email:email.value.trim(),code:code.value.trim()});location.href=nextPath()}}catch(e){showError(e)}finally{button.disabled=false}});
</script></body></html>
